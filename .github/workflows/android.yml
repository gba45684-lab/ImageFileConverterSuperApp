name: ImageMate Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imagemate-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ImageMate v$VERSION"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Initialize Capacitor
        run: npx cap init ImageMate com.gba45684.imagemate --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Configure Android
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', f'versionCode {os.environ.get("GITHUB_RUN_NUMBER","1")}', s, count=1)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "{os.environ["APP_VERSION"]}"', s, count=1)
          p.write_text(s)

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application ', 1)
          if 'android.permission.VIBRATE' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.VIBRATE" />\n    <application ', 1)
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application ', 1)
          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              text=text.replace('</application>', '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />\n  </application>')
          if 'android:name="androidx.core.content.FileProvider"' not in text:
              provider='''    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">
              <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
            </provider>
          '''
              text=text.replace('</application>', provider+'  </application>')
          manifest.write_text(text)

          values=Path('android/app/src/main/res/values/strings.xml')
          vt=values.read_text()
          if 'name="admob_app_id"' not in vt:
              vt=vt.replace('</resources>', '    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\n</resources>')
          values.write_text(vt)

          xml=Path('android/app/src/main/res/xml')
          xml.mkdir(parents=True,exist_ok=True)
          (xml/'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-files-path name="downloads" path="Download/" />
          </paths>
          ''')
          PY

      - name: Install updater bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/gba45684/imagemate
          cat > android/app/src/main/java/com/gba45684/imagemate/ImageMateUpdaterPlugin.java <<'JAVA'
          package com.gba45684.imagemate;

          import android.app.DownloadManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.ContentValues;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.provider.MediaStore;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "ImageMateUpdater")
          public class ImageMateUpdaterPlugin extends Plugin {
          private static final String CHANNEL_ID = "imagemate_updates_v2";
          private static final int NOTIFICATION_ID = 2407;

          @PluginMethod
          public void requestNotificationPermission(PluginCall call) {
          Context context = getContext();
          boolean granted = Build.VERSION.SDK_INT < 33 ||
            androidx.core.content.ContextCompat.checkSelfPermission(context, "android.permission.POST_NOTIFICATIONS") == android.content.pm.PackageManager.PERMISSION_GRANTED;
          if (!granted && Build.VERSION.SDK_INT >= 33) {
            getActivity().requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 9182);
          }
          JSObject out = new JSObject();
          out.put("granted", granted);
          out.put("requested", !granted && Build.VERSION.SDK_INT >= 33);
          call.resolve(out);
          }

          @PluginMethod
          public void notifyUpdate(PluginCall call) {
          String version = call.getString("version", "");
          Context context = getContext();
          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);

          if (Build.VERSION.SDK_INT >= 26) {
          NotificationChannel channel = new NotificationChannel(
          CHANNEL_ID, "ImageMate updates", NotificationManager.IMPORTANCE_HIGH
          );
          channel.setDescription("Notifications for new ImageMate app versions");
          channel.enableVibration(true);
          channel.setVibrationPattern(new long[]{0,250,120,250});
          channel.setSound(
          android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
          new AudioAttributes.Builder()
          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
          .build()
          );
          nm.createNotificationChannel(channel);
          }

          Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
          PendingIntent pending = launch == null ? null : PendingIntent.getActivity(
          context, 2407, launch,
          PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0)
          );

          NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
          .setSmallIcon(context.getApplicationInfo().icon)
          .setContentTitle("ImageMate update available")
          .setContentText("Version " + version + " is ready. Tap Update in ImageMate to install it.")
          .setPriority(NotificationCompat.PRIORITY_HIGH)
          .setAutoCancel(true)
          .setVibrate(new long[]{0,250,120,250});
          if (pending != null) builder.setContentIntent(pending);
          nm.notify(NOTIFICATION_ID, builder.build());

          try {
          Vibrator vibrator = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);
          if (vibrator != null && vibrator.hasVibrator()) {
          if (Build.VERSION.SDK_INT >= 26) vibrator.vibrate(VibrationEffect.createWaveform(new long[]{0,250,120,250}, -1));
          else vibrator.vibrate(new long[]{0,250,120,250}, -1);
          }
          } catch (Exception ignored) {}

          JSObject result = new JSObject();
          result.put("notified", true);
          result.put("version", version);
          call.resolve(result);
          }

          @PluginMethod
          public void saveProcessedFile(PluginCall call) {
          String name = call.getString("name", "ImageMate-output.bin");
          String mime = call.getString("mime", "application/octet-stream");
          String base64 = call.getString("base64", "");
          if (base64 == null || base64.isEmpty()) { call.reject("File data is missing"); return; }
          Context context = getContext();
          try {
          byte[] data = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);
          File dir = context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
          if (dir == null) { call.reject("Device storage is unavailable"); return; }
          if (!dir.exists()) dir.mkdirs();
          File out = new File(dir, name);
          try (java.io.FileOutputStream stream = new java.io.FileOutputStream(out)) {
          stream.write(data);
          }
          Uri contentUri = FileProvider.getUriForFile(context, context.getPackageName() + ".fileprovider", out);
          Intent open = new Intent(Intent.ACTION_VIEW);
          open.setDataAndType(contentUri, mime);
          open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          try { context.startActivity(open); } catch (Exception ignored) {}
          
          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
          if (Build.VERSION.SDK_INT >= 26) {
          NotificationChannel channel = new NotificationChannel(
          "imagemate_files", "ImageMate downloads", NotificationManager.IMPORTANCE_HIGH
          );
          channel.enableVibration(true);
          channel.setVibrationPattern(new long[]{0,180,100,180});
          channel.setSound(
          android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
          new AudioAttributes.Builder()
          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
          .build()
          );
          nm.createNotificationChannel(channel);
          }
          Intent openFile = new Intent(Intent.ACTION_VIEW);
          openFile.setDataAndType(contentUri, mime);
          openFile.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          PendingIntent pending = PendingIntent.getActivity(
          context, 2408, openFile,
          PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0)
          );
          NotificationCompat.Builder builder = new NotificationCompat.Builder(context, "imagemate_files")
          .setSmallIcon(context.getApplicationInfo().icon)
          .setContentTitle("ImageMate download complete")
          .setContentText(name + " is saved. Tap to open it.")
          .setPriority(NotificationCompat.PRIORITY_HIGH)
          .setAutoCancel(true)
          .setVibrate(new long[]{0,180,100,180});
          if (pending != null) builder.setContentIntent(pending);
          nm.notify((int)(System.currentTimeMillis() & 0x7fffffff), builder.build());
          
          trackDownloadedFile(context, out, name, mime);
          JSObject result = new JSObject();
          result.put("saved", true);
          result.put("name", name);
          result.put("path", out.getAbsolutePath());
          result.put("mime", mime);
          call.resolve(result);
          } catch (Exception e) {
          call.reject("Could not save or open the file", e);
          }
          }

          private static final String FILES_JSON = "downloaded_files";

          private void trackDownloadedFile(Context context, File file, String name, String mime) {
          try {
          android.content.SharedPreferences sp = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
          JSONArray old = new JSONArray(sp.getString(FILES_JSON, "[]"));
          JSONArray out = new JSONArray();
          JSONObject item = new JSONObject(); item.put("name", name); item.put("path", file.getAbsolutePath()); item.put("mime", mime); item.put("size", file.length()); item.put("at", System.currentTimeMillis()); out.put(item);
          for (int i=0;i<old.length() && out.length()<100;i++) { JSONObject x=old.optJSONObject(i); if(x==null)continue; if(file.getAbsolutePath().equals(x.optString("path","")))continue; if(new File(x.optString("path","")).exists())out.put(x); }
          sp.edit().putString(FILES_JSON, out.toString()).apply();
          } catch(Exception ignored) {}
          }

          @PluginMethod
          public void listDownloadedFiles(PluginCall call) {
          Context context=getContext(); JSONArray arr=new JSONArray();
          try {
          android.content.SharedPreferences sp=context.getSharedPreferences(PREFS,Context.MODE_PRIVATE);
          JSONArray old=new JSONArray(sp.getString(FILES_JSON,"[]"));
          JSONArray clean=new JSONArray();
          for(int i=0;i<old.length();i++){JSONObject x=old.optJSONObject(i);if(x==null)continue;File f=new File(x.optString("path",""));if(f.exists()){x.put("size",f.length());clean.put(x);}}
          sp.edit().putString(FILES_JSON,clean.toString()).apply(); arr=clean;
          } catch(Exception ignored) {}
          JSObject result=new JSObject(); result.put("files",arr); result.put("count",arr.length()); call.resolve(result);
          }

          private File fileFromPath(String path) { if(path==null||path.isEmpty())return null; File f=new File(path); return f.exists()?f:null; }

          @PluginMethod
          public void openDownloadedFile(PluginCall call) {
          String path=call.getString("path",""); File file=fileFromPath(path); if(file==null){call.reject("File not found");return;} String mime=call.getString("mime","");
          try {
          String name=file.getName(); android.content.SharedPreferences sp=getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE); JSONArray arr=new JSONArray(sp.getString(FILES_JSON,"[]")); for(int i=0;i<arr.length();i++){JSONObject x=arr.optJSONObject(i);if(x!=null&&path.equals(x.optString("path",""))){mime=x.optString("mime",mime);break;}}
          if(mime==null||mime.isEmpty())mime="application/octet-stream"; Uri uri=FileProvider.getUriForFile(getContext(),getContext().getPackageName()+".fileprovider",file); Intent open=new Intent(Intent.ACTION_VIEW);open.setDataAndType(uri,mime);open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_GRANT_READ_URI_PERMISSION);getContext().startActivity(open);call.resolve();
          }catch(Exception e){call.reject("Unable to open file",e);}
          }

          @PluginMethod
          public void shareDownloadedFile(PluginCall call) {
          String path=call.getString("path",""); File file=fileFromPath(path); if(file==null){call.reject("File not found");return;} try{
          String mime="application/octet-stream";android.content.SharedPreferences sp=getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE);JSONArray arr=new JSONArray(sp.getString(FILES_JSON,"[]"));for(int i=0;i<arr.length();i++){JSONObject x=arr.optJSONObject(i);if(x!=null&&path.equals(x.optString("path",""))){mime=x.optString("mime",mime);break;}}
          Uri uri=FileProvider.getUriForFile(getContext(),getContext().getPackageName()+".fileprovider",file);Intent share=new Intent(Intent.ACTION_SEND);share.setType(mime);share.putExtra(Intent.EXTRA_STREAM,uri);share.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK);getContext().startActivity(Intent.createChooser(share,"Share file"));call.resolve();
          }catch(Exception e){call.reject("Unable to share file",e);}
          }

          @PluginMethod
          public void exportDownloadedFile(PluginCall call) {
          String path=call.getString("path","");String name=call.getString("name","ImageMate-file");String mime=call.getString("mime","application/octet-stream");File source=fileFromPath(path);if(source==null){call.reject("File not found");return;}
          try{
          if(Build.VERSION.SDK_INT>=29){ContentValues values=new ContentValues();values.put(MediaStore.Downloads.DISPLAY_NAME,name);values.put(MediaStore.Downloads.MIME_TYPE,mime);values.put(MediaStore.Downloads.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS+"/ImageMate");Uri uri=getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,values);if(uri==null)throw new java.io.IOException("Could not create Downloads entry");try(FileInputStream in=new FileInputStream(source);java.io.OutputStream out=getContext().getContentResolver().openOutputStream(uri)){byte[] buf=new byte[8192];int n;while((n=in.read(buf))>0)out.write(buf,0,n);}}else{File dir=Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);if(!dir.exists())dir.mkdirs();File dest=new File(dir,name);try(FileInputStream in=new FileInputStream(source);FileOutputStream out=new FileOutputStream(dest)){byte[] buf=new byte[8192];int n;while((n=in.read(buf))>0)out.write(buf,0,n);}}
          call.resolve();
          }catch(Exception e){call.reject("Unable to save another copy",e);}
          }

          private static final String PREFS = "imagemate_updater";
          private static final String APK_PATH = "apk_path";
          private static final String APK_VERSION = "apk_version";

          private File downloadedApk(Context context) {
          String path = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(APK_PATH, "");
          return path.isEmpty() ? null : new File(path);
          }

          @PluginMethod
          public void downloadUpdate(PluginCall call) {
          String url = call.getString("url");
          if (url == null || url.isEmpty()) { call.reject("Update URL is missing"); return; }
          Context context = getContext();
          DownloadManager dm = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
          File target = new File(context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "ImageMate-latest.apk");
          if (target.exists()) target.delete();
          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
          request.setTitle("ImageMate update");
          request.setDescription("Downloading the latest ImageMate update in background");
          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
          request.setMimeType("application/vnd.android.package-archive");
          request.setDestinationInExternalFilesDir(context, Environment.DIRECTORY_DOWNLOADS, "ImageMate-latest.apk");
          final long id = dm.enqueue(request);
          context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("download_id", String.valueOf(id)).apply();

          final BroadcastReceiver receiver = new BroadcastReceiver() {
          @Override public void onReceive(Context c, Intent intent) {
          if (intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1) != id) return;
          try {
          DownloadManager.Query q = new DownloadManager.Query().setFilterById(id);
          android.database.Cursor cursor = dm.query(q);
          if (cursor == null || !cursor.moveToFirst()) { if (cursor != null) cursor.close(); return; }
          int status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
          cursor.close();
          if (status != DownloadManager.STATUS_SUCCESSFUL || !target.exists()) return;
          context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
            .putString(APK_PATH, target.getAbsolutePath()).apply();
          postUpdateReadyNotification(context);
          try { launchDownloadedInstaller(context, target); } catch (Exception installError) {
          android.util.Log.e("ImageMateUpdater", "Could not auto-open installer", installError);
          }
          } catch (Exception e) {
          android.util.Log.e("ImageMateUpdater", "Update download failed", e);
          } finally {
          try { context.unregisterReceiver(this); } catch (Exception ignored) {}
          }
          }
          };
          ContextCompat.registerReceiver(context, receiver,
          new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE),
          ContextCompat.RECEIVER_NOT_EXPORTED);
          JSObject result = new JSObject();
          result.put("started", true);
          result.put("downloadId", id);
          call.resolve(result);
          }

          private void postUpdateReadyNotification(Context context) {
          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
          if (Build.VERSION.SDK_INT >= 26) {
          NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "ImageMate updates", NotificationManager.IMPORTANCE_HIGH);
          channel.enableVibration(true);
          channel.setVibrationPattern(new long[]{0,250,120,250});
          channel.setSound(android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
            new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
          nm.createNotificationChannel(channel);
          }
          Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
          PendingIntent pending = launch == null ? null : PendingIntent.getActivity(context, 2408, launch,
            PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
          NotificationCompat.Builder b = new NotificationCompat.Builder(context, CHANNEL_ID)
            .setSmallIcon(context.getApplicationInfo().icon)
            .setContentTitle("ImageMate update downloaded")
            .setContentText("Update is ready. Open ImageMate and tap Install update.")
            .setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_HIGH);
          if (pending != null) b.setContentIntent(pending);
          nm.notify(NOTIFICATION_ID + 1, b.build());
          Vibrator v=(Vibrator)context.getSystemService(Context.VIBRATOR_SERVICE);
          if(v!=null) {
            if(Build.VERSION.SDK_INT>=26)v.vibrate(VibrationEffect.createWaveform(new long[]{0,250,120,250},-1));
            else v.vibrate(new long[]{0,250,120,250},-1);
          }
          }

          private void launchDownloadedInstaller(Context context, File apk) {
          if (apk == null || !apk.exists()) return;
          if (Build.VERSION.SDK_INT >= 26 && !context.getPackageManager().canRequestPackageInstalls()) {
          Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + context.getPackageName()));
          settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
          context.startActivity(settings);
          return;
          }
          Uri uri = FileProvider.getUriForFile(context, context.getPackageName() + ".fileprovider", apk);
          Intent installer = new Intent(Intent.ACTION_VIEW);
          installer.setDataAndType(uri, "application/vnd.android.package-archive");
          installer.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          context.startActivity(installer);
          }

          @PluginMethod
          public void hasDownloadedUpdate(PluginCall call) {
          Context context=getContext(); File apk=downloadedApk(context);
          JSObject out=new JSObject(); out.put("ready", apk!=null && apk.exists()); call.resolve(out);
          }

          @PluginMethod
          public void installDownloadedUpdate(PluginCall call) {
          Context context=getContext();
          if (Build.VERSION.SDK_INT >= 26 && !context.getPackageManager().canRequestPackageInstalls()) {
          Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:"+context.getPackageName()));
          settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); context.startActivity(settings); call.resolve(); return;
          }
          File apk=downloadedApk(context);
          if(apk==null || !apk.exists()){ call.reject("Downloaded update is not ready"); return; }
          try {
          Uri contentUri=FileProvider.getUriForFile(context, context.getPackageName()+".fileprovider", apk);
          Intent install=new Intent(Intent.ACTION_VIEW);
          install.setDataAndType(contentUri,"application/vnd.android.package-archive");
          install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          context.startActivity(install);
          } catch(Exception e) { call.reject("Could not open Android installer: "+e.getMessage()); }
          }
          }
          JAVA

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageMate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ImageMate.apk
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" ImageMate.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$APP_VERSION" ImageMate.apk --repo "$GITHUB_REPOSITORY" --title "ImageMate v$APP_VERSION" --generate-notes
          fi
          echo "Stable APK: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ImageMate.apk"
