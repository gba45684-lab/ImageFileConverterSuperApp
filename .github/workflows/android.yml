name: ImageMate Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read app version
        id: version
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Initialize Capacitor
        run: npx cap init ImageMate com.gba45684.imagemate --web-dir dist
      - name: Add Android
        run: npx cap add android
      - name: Configure Android version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\\s+\\d+',f'versionCode {os.environ.get("GITHUB_RUN_NUMBER","1")}',s,count=1)
          s=re.sub(r'versionName\\s+"[^"]+"',f'versionName "{os.environ["APP_VERSION"]}"',s,count=1)
          p.write_text(s)
          PY
      - name: Configure Google AdMob test app and APK installer permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n\n    <application ', 1)
          marker='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID"'
          if marker not in text:
              text=text.replace('</application>', '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />\n  </application>')
          if 'android:name="androidx.core.content.FileProvider"' not in text:
              provider='''    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">\n      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />\n    </provider>\n'''
              text=text.replace('</application>',provider+'  </application>')
          manifest.write_text(text)
          values=Path('android/app/src/main/res/values/strings.xml')
          vt=values.read_text()
          if 'name="admob_app_id"' not in vt:
              vt=vt.replace('</resources>','    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\n</resources>')
          values.write_text(vt)
          xml=Path('android/app/src/main/res/xml')
          xml.mkdir(parents=True,exist_ok=True)
          (xml/'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n  <external-files-path name="downloads" path="Download/" />\n</paths>\n''')
          PY
      - name: Install Android updater bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/gba45684/imagemate
          cat > android/app/src/main/java/com/gba45684/imagemate/ImageMateUpdaterPlugin.java <<'JAVA'
          package com.gba45684.imagemate;
          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.Settings;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;

          @CapacitorPlugin(name = "ImageMateUpdater")
          public class ImageMateUpdaterPlugin extends Plugin {
            @PluginMethod
            public void downloadAndInstall(PluginCall call) {
              String url=call.getString("url");
              if(url==null||url.isEmpty()){call.reject("Update URL is missing");return;}
              Context context=getContext();
              if(android.os.Build.VERSION.SDK_INT>=26&&!context.getPackageManager().canRequestPackageInstalls()){
                Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:"+context.getPackageName()));
                settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                context.startActivity(settings);
                call.resolve();
                return;
              }
              DownloadManager dm=(DownloadManager)context.getSystemService(Context.DOWNLOAD_SERVICE);
              DownloadManager.Request request=new DownloadManager.Request(Uri.parse(url));
              request.setTitle("ImageMate update");
              request.setDescription("Downloading the latest ImageMate APK");
              request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
              request.setMimeType("application/vnd.android.package-archive");
              request.setDestinationInExternalFilesDir(context,Environment.DIRECTORY_DOWNLOADS,"ImageMate-latest.apk");
              final long id=dm.enqueue(request);
              final BroadcastReceiver receiver=new BroadcastReceiver(){
                @Override public void onReceive(Context c,Intent intent){
                  if(intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID,-1)!=id)return;
                  try{
                    DownloadManager.Query q=new DownloadManager.Query().setFilterById(id);
                    android.database.Cursor cursor=dm.query(q);
                    if(cursor==null||!cursor.moveToFirst()){if(cursor!=null)cursor.close();return;}
                    int status=cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                    String localUri=cursor.getString(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_LOCAL_URI));
                    cursor.close();
                    if(status!=DownloadManager.STATUS_SUCCESSFUL||localUri==null)return;
                    File apk=new File(Uri.parse(localUri).getPath());
                    Uri contentUri=FileProvider.getUriForFile(context,context.getPackageName()+".fileprovider",apk);
                    Intent install=new Intent(Intent.ACTION_VIEW);
                    install.setDataAndType(contentUri,"application/vnd.android.package-archive");
                    install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    context.startActivity(install);
                  }catch(Exception e){android.util.Log.e("ImageMateUpdater","Install failed",e);}
                  finally{try{ContextCompat.unregisterReceiver(context,this);}catch(Exception ignored){}}
                }
              };
              ContextCompat.registerReceiver(context,receiver,new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE),ContextCompat.RECEIVER_NOT_EXPORTED);
              JSObject result=new JSObject();
              result.put("started",true);
              result.put("downloadId",id);
              call.resolve(result);
            }
          }
          JAVA
          cat > android/app/src/main/java/com/gba45684/imagemate/MainActivity.java <<'JAVA'
          package com.gba45684.imagemate;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(android.os.Bundle savedInstanceState) {
              registerPlugin(ImageMateUpdaterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageMate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ImageMate.apk
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" ImageMate.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$APP_VERSION" ImageMate.apk --repo "$GITHUB_REPOSITORY" --title "ImageMate v$APP_VERSION" --generate-notes
          fi
