name: ImageMate Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imagemate-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read app version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ImageMate v${VERSION}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inject Android version into web updater
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          s=s.replace('const APP_VERSION=packageJson.version;', 'const APP_VERSION=' + repr(os.environ['APP_VERSION']) + ';')
          p.write_text(s)
          PY

      - name: Build web app
        run: npm run build

      - name: Initialize Capacitor
        run: npx cap init ImageMate com.gba45684.imagemate --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Prepare persistent signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.IMAGEMATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IMAGEMATE_KEYSTORE_PASSWORD }}
        run: |
          EXPECTED_CERT="ff5d698c7f2a3a8a22501da0ae19597fdc1ec8767b99b67f8fdc94203f53a8ab"
          if [[ -z "$KEYSTORE_BASE64" && -z "$KEYSTORE_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable release publishing is disabled until IMAGEMATE_KEYSTORE_BASE64 and IMAGEMATE_KEYSTORE_PASSWORD are configured."
            exit 0
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Both persistent signing secrets are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/imagemate-release.jks
          test -s android/app/imagemate-release.jks
          ACTUAL_CERT="$(keytool -list -v -keystore android/app/imagemate-release.jks -storepass "$KEYSTORE_PASSWORD" -alias imagemate-release 2>/dev/null | awk '/SHA256:/ { gsub(":", "", $2); print tolower($2); exit }')"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Configured keystore certificate does not match the pinned ImageMate release certificate."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Persistent ImageMate release key verified."

      - name: Configure Android
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          IMAGEMATE_SIGNING_READY: ${{ steps.signing.outputs.ready }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', f'versionCode {os.environ.get("GITHUB_RUN_NUMBER","1")}', s, count=1)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "{os.environ["APP_VERSION"]}"', s, count=1)
          if os.environ.get("IMAGEMATE_SIGNING_READY") == "true":
              signing = """
          signingConfigs {
              release {
                  storeFile file("imagemate-release.jks")
                  storePassword System.getenv("IMAGEMATE_KEYSTORE_PASSWORD")
                  keyAlias "imagemate-release"
                  keyPassword System.getenv("IMAGEMATE_KEYSTORE_PASSWORD")
              }
          }
          """
              s=s.replace("android {", "android {\\n"+signing, 1)
              build_types=s.find("buildTypes")
              release_open=s.find("release {", build_types)
              if build_types < 0 or release_open < 0:
                  raise SystemExit("Could not configure release signing: buildTypes.release block is missing")
              release_open += len("release {")
              s=s[:release_open]+"\\n            signingConfig signingConfigs.release"+s[release_open:]
          p.write_text(s)

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application ', 1)
          if 'android.permission.VIBRATE' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.VIBRATE" />\n    <application ', 1)
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application ', 1)
          if 'android.permission.WRITE_EXTERNAL_STORAGE' not in text:
              text=text.replace('<application ', '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application ', 1)
          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              text=text.replace('</application>', '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />\n  </application>')
          if 'android:name="androidx.core.content.FileProvider"' not in text:
              provider='''    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">
              <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
            </provider>
          '''
              text=text.replace('</application>', provider+'  </application>')
          manifest.write_text(text)

          values=Path('android/app/src/main/res/values/strings.xml')
          vt=values.read_text()
          if 'name="admob_app_id"' not in vt:
              vt=vt.replace('</resources>', '    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\n</resources>')
          values.write_text(vt)

          xml=Path('android/app/src/main/res/xml')
          xml.mkdir(parents=True,exist_ok=True)
          (xml/'file_paths.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-files-path name="downloads" path="Download/" />
            <cache-path name="open_cache" path="." />
          </paths>
          ''')
          PY

      - name: Install updater bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/gba45684/imagemate
          cat > android/app/src/main/java/com/gba45684/imagemate/MainActivity.java <<'JAVA'
          package com.gba45684.imagemate;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ImageMateUpdaterPlugin.class);
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              getWindow().setStatusBarColor(Color.TRANSPARENT);
              getWindow().setNavigationBarColor(Color.TRANSPARENT);
              View root = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(root, (view, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                view.setPadding(0, bars.top, 0, bars.bottom);
                return insets;
              });
              ViewCompat.requestApplyInsets(root);
            }
          }
          JAVA
          cat > android/app/src/main/java/com/gba45684/imagemate/ImageMateUpdaterPlugin.java <<'JAVA'
          package com.gba45684.imagemate;

          import android.app.DownloadManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.ContentValues;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.provider.MediaStore;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "ImageMateUpdater")
          public class ImageMateUpdaterPlugin extends Plugin {
          private static final String CHANNEL_ID = "imagemate_updates_v2";
          private static final int NOTIFICATION_ID = 2407;

          @PluginMethod
          public void requestNotificationPermission(PluginCall call) {
          Context context = getContext();
          boolean granted = Build.VERSION.SDK_INT < 33 ||
            androidx.core.content.ContextCompat.checkSelfPermission(context, "android.permission.POST_NOTIFICATIONS") == android.content.pm.PackageManager.PERMISSION_GRANTED;
          if (!granted && Build.VERSION.SDK_INT >= 33) {
            getActivity().requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 9182);
          }
          JSObject out = new JSObject();
          out.put("granted", granted);
          out.put("requested", !granted && Build.VERSION.SDK_INT >= 33);
          call.resolve(out);
          }

          @PluginMethod
          public void notifyUpdate(PluginCall call) {
          String version = call.getString("version", "");
          Context context = getContext();
          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
          if (Build.VERSION.SDK_INT >= 33 &&
              androidx.core.content.ContextCompat.checkSelfPermission(context, "android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
            JSObject denied = new JSObject();
            denied.put("notified", false);
            denied.put("version", version);
            denied.put("reason", "Notification permission not granted");
            call.resolve(denied);
            return;
          }

          if (Build.VERSION.SDK_INT >= 26) {
          NotificationChannel channel = new NotificationChannel(
          CHANNEL_ID, "ImageMate updates", NotificationManager.IMPORTANCE_HIGH
          );
          channel.setDescription("Notifications for new ImageMate app versions");
          channel.enableVibration(true);
          channel.setVibrationPattern(new long[]{0,250,120,250});
          channel.setSound(
          android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
          new AudioAttributes.Builder()
          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
          .build()
          );
          nm.createNotificationChannel(channel);
          }

          Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
          PendingIntent pending = launch == null ? null : PendingIntent.getActivity(
          context, 2407, launch,
          PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0)
          );

          NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
          .setSmallIcon(android.R.drawable.stat_sys_download_done)
          .setContentTitle("ImageMate update available")
          .setContentText("Version " + version + " is ready. Tap Update in ImageMate to install it.")
          .setPriority(NotificationCompat.PRIORITY_HIGH)
          .setAutoCancel(true)
          .setVibrate(new long[]{0,250,120,250});
          if (pending != null) builder.setContentIntent(pending);
          nm.notify(NOTIFICATION_ID, builder.build());

          try {
          Vibrator vibrator = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);
          if (vibrator != null && vibrator.hasVibrator()) {
          if (Build.VERSION.SDK_INT >= 26) vibrator.vibrate(VibrationEffect.createWaveform(new long[]{0,250,120,250}, -1));
          else vibrator.vibrate(new long[]{0,250,120,250}, -1);
          }
          } catch (Exception ignored) {}

          JSObject result = new JSObject();
          result.put("notified", true);
          result.put("version", version);
          call.resolve(result);
          }

          @PluginMethod
          public void getAppVersion(PluginCall call) {
          try {
          String version = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0).versionName;
          JSObject out = new JSObject();
          out.put("version", version == null ? "" : version);
          call.resolve(out);
          } catch (Exception e) {
          call.reject("Could not read installed app version", e);
          }
          }

          @PluginMethod
          public void saveProcessedFile(PluginCall call) {
          String requestedName = call.getString("name", "ImageMate-output.bin");
          String mime = call.getString("mime", "application/octet-stream");
          String base64 = call.getString("base64", "");
          if (base64 == null || base64.isEmpty()) { call.reject("File data is missing"); return; }
          Context context = getContext();
          try {
          byte[] data = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);
          File dir = context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
          if (dir == null) { call.reject("Device storage is unavailable"); return; }
          if (!dir.exists() && !dir.mkdirs()) { call.reject("Could not prepare file storage"); return; }
          String safeName = safeFileName(requestedName, "ImageMate-output.bin");
          File out = uniqueFile(dir, safeName);
          try (java.io.FileOutputStream stream = new java.io.FileOutputStream(out)) {
          stream.write(data);
          }
          String name = out.getName();
          Uri contentUri = FileProvider.getUriForFile(context, context.getPackageName() + ".fileprovider", out);
          
          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
          if (Build.VERSION.SDK_INT >= 26) {
          NotificationChannel channel = new NotificationChannel(
          "imagemate_files", "ImageMate downloads", NotificationManager.IMPORTANCE_HIGH
          );
          channel.enableVibration(true);
          channel.setVibrationPattern(new long[]{0,180,100,180});
          channel.setSound(
          android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
          new AudioAttributes.Builder()
          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
          .build()
          );
          nm.createNotificationChannel(channel);
          }
          Intent openFile = new Intent(Intent.ACTION_VIEW);
          openFile.setDataAndType(contentUri, mime);
          openFile.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          if (Build.VERSION.SDK_INT >= 16) openFile.setClipData(android.content.ClipData.newRawUri("ImageMate file", contentUri));
          PendingIntent pending = PendingIntent.getActivity(
          context, 2408, openFile,
          PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0)
          );
          NotificationCompat.Builder builder = new NotificationCompat.Builder(context, "imagemate_files")
          .setSmallIcon(android.R.drawable.stat_sys_download_done)
          .setContentTitle("ImageMate download complete")
          .setContentText(name + " is saved. Tap to open it.")
          .setPriority(NotificationCompat.PRIORITY_HIGH)
          .setAutoCancel(true)
          .setVibrate(new long[]{0,180,100,180});
          if (pending != null) builder.setContentIntent(pending);
          nm.notify((int)(System.currentTimeMillis() & 0x7fffffff), builder.build());
          
          trackDownloadedFile(context, out, name, mime);
          JSObject result = new JSObject();
          result.put("saved", true);
          result.put("name", name);
          result.put("path", out.getAbsolutePath());
          result.put("mime", mime);
          call.resolve(result);
          } catch (Exception e) {
          call.reject("Could not save or open the file", e);
          }
          }

          private String safeFileName(String value, String fallback) {
          String name = value == null ? "" : new File(value).getName();
          name = name.replaceAll("[\\\\/:*?\"<>|\\p{Cntrl}]", "_").trim();
          if (name.isEmpty() || ".".equals(name) || "..".equals(name)) return fallback;
          return name;
          }

          private File uniqueFile(File dir, String requestedName) {
          File candidate = new File(dir, requestedName);
          if (!candidate.exists()) return candidate;
          String base = requestedName;
          String ext = "";
          int dot = requestedName.lastIndexOf('.');
          if (dot > 0) { base = requestedName.substring(0, dot); ext = requestedName.substring(dot); }
          for (int i = 1; i < 10000; i++) {
            candidate = new File(dir, base + " (" + i + ")" + ext);
            if (!candidate.exists()) return candidate;
          }
          return new File(dir, base + " (" + System.currentTimeMillis() + ")" + ext);
          }

          private static final String FILES_JSON = "downloaded_files";

          private void trackDownloadedFile(Context context, File file, String name, String mime) {
          try {
          android.content.SharedPreferences sp = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
          JSONArray old = new JSONArray(sp.getString(FILES_JSON, "[]"));
          JSONArray out = new JSONArray();
          JSONObject item = new JSONObject(); item.put("name", name); item.put("path", file.getAbsolutePath()); item.put("mime", mime); item.put("size", file.length()); item.put("at", System.currentTimeMillis()); out.put(item);
          for (int i=0;i<old.length() && out.length()<100;i++) { JSONObject x=old.optJSONObject(i); if(x==null)continue; if(file.getAbsolutePath().equals(x.optString("path","")))continue; if(new File(x.optString("path","")).exists())out.put(x); }
          sp.edit().putString(FILES_JSON, out.toString()).apply();
          } catch(Exception ignored) {}
          }

          @PluginMethod
          public void listDownloadedFiles(PluginCall call) {
          Context context=getContext(); JSONArray arr=new JSONArray();
          try {
          android.content.SharedPreferences sp=context.getSharedPreferences(PREFS,Context.MODE_PRIVATE);
          JSONArray old=new JSONArray(sp.getString(FILES_JSON,"[]"));
          JSONArray clean=new JSONArray();
          for(int i=0;i<old.length();i++){JSONObject x=old.optJSONObject(i);if(x==null)continue;File f=new File(x.optString("path",""));if(f.exists()){x.put("size",f.length());clean.put(x);}}
          sp.edit().putString(FILES_JSON,clean.toString()).apply(); arr=clean;
          } catch(Exception ignored) {}
          JSObject result=new JSObject(); result.put("files",arr); result.put("count",arr.length()); call.resolve(result);
          }

          private File fileFromPath(String path) { if(path==null||path.isEmpty())return null; File f=new File(path); return f.exists()?f:null; }

          private String resolveMime(String mime, File file) {
          if (mime != null && !mime.isEmpty() && !"application/octet-stream".equals(mime)) return mime;
          String n = file == null ? "" : file.getName().toLowerCase(java.util.Locale.US);
          if (n.endsWith(".pdf")) return "application/pdf";
          if (n.endsWith(".jpg") || n.endsWith(".jpeg")) return "image/jpeg";
          if (n.endsWith(".png")) return "image/png";
          if (n.endsWith(".webp")) return "image/webp";
          if (n.endsWith(".avif")) return "image/avif";
          if (n.endsWith(".gif")) return "image/gif";
          if (n.endsWith(".txt")) return "text/plain";
          if (n.endsWith(".zip")) return "application/zip";
          return mime == null || mime.isEmpty() ? "application/octet-stream" : mime;
          }

          private void addReadGrant(Intent intent, Uri uri) {
          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          if (Build.VERSION.SDK_INT >= 16) intent.setClipData(android.content.ClipData.newRawUri("ImageMate file", uri));
          }

          @PluginMethod
          public void openDownloadedFile(PluginCall call) {
          String path=call.getString("path",""); File file=fileFromPath(path); if(file==null){call.reject("File not found");return;} String mime=call.getString("mime","");
          try {
          String name=file.getName(); android.content.SharedPreferences sp=getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE); JSONArray arr=new JSONArray(sp.getString(FILES_JSON,"[]")); for(int i=0;i<arr.length();i++){JSONObject x=arr.optJSONObject(i);if(x!=null&&path.equals(x.optString("path",""))){mime=x.optString("mime",mime);break;}}
          mime=resolveMime(mime,file);
          File openDir = new File(getContext().getCacheDir(), "open");
          if (!openDir.exists()) openDir.mkdirs();
          File openFile = new File(openDir, file.getName());
          try (FileInputStream in = new FileInputStream(file); FileOutputStream out = new FileOutputStream(openFile)) {
            byte[] buf = new byte[16384]; int n;
            while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
          }
          Uri uri=FileProvider.getUriForFile(getContext(),getContext().getPackageName()+".fileprovider",openFile);
          Intent open=new Intent(Intent.ACTION_VIEW); open.setDataAndType(uri,mime); addReadGrant(open,uri);
          try {
            getContext().startActivity(Intent.createChooser(open,"Open with"));
          } catch (android.content.ActivityNotFoundException noHandler) {
            Intent generic=new Intent(Intent.ACTION_VIEW); generic.setDataAndType(uri,mime); addReadGrant(generic,uri);
            getContext().startActivity(Intent.createChooser(generic,"Open file"));
          }
          call.resolve();
          }catch(Exception e){call.reject("Unable to open file: "+(e.getMessage()==null?"No compatible app is installed":e.getMessage()),e);}
          }

          @PluginMethod
          public void shareDownloadedFile(PluginCall call) {
          String path=call.getString("path",""); File file=fileFromPath(path); if(file==null){call.reject("File not found");return;} try{
          String mime="application/octet-stream";android.content.SharedPreferences sp=getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE);JSONArray arr=new JSONArray(sp.getString(FILES_JSON,"[]"));for(int i=0;i<arr.length();i++){JSONObject x=arr.optJSONObject(i);if(x!=null&&path.equals(x.optString("path",""))){mime=x.optString("mime",mime);break;}}
          mime=resolveMime(mime,file);
          Uri uri=FileProvider.getUriForFile(getContext(),getContext().getPackageName()+".fileprovider",file);
          Intent share=new Intent(Intent.ACTION_SEND);share.setType(mime);share.putExtra(Intent.EXTRA_STREAM,uri);addReadGrant(share,uri);
          getContext().startActivity(Intent.createChooser(share,"Share file"));call.resolve();
          }catch(Exception e){call.reject("Unable to share file: "+(e.getMessage()==null?"No compatible app is installed":e.getMessage()),e);}
          }

          @PluginMethod
          public void exportDownloadedFile(PluginCall call) {
          String path=call.getString("path","");String name=safeFileName(call.getString("name","ImageMate-file"),"ImageMate-file");String mime=call.getString("mime","application/octet-stream");File source=fileFromPath(path);if(source==null){call.reject("File not found");return;}
          Uri pendingUri=null;
          try{
          if(Build.VERSION.SDK_INT>=23 && Build.VERSION.SDK_INT<29 &&
              androidx.core.content.ContextCompat.checkSelfPermission(getContext(), "android.permission.WRITE_EXTERNAL_STORAGE") != android.content.pm.PackageManager.PERMISSION_GRANTED){
            getActivity().requestPermissions(new String[]{"android.permission.WRITE_EXTERNAL_STORAGE"}, 9183);
            call.reject("Storage permission is required. Allow it, then tap Download again.");
            return;
          }
          if(Build.VERSION.SDK_INT>=29){
          ContentValues values=new ContentValues();values.put(MediaStore.Downloads.DISPLAY_NAME,name);values.put(MediaStore.Downloads.MIME_TYPE,resolveMime(mime,source));values.put(MediaStore.Downloads.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS+"/ImageMate");values.put(MediaStore.Downloads.IS_PENDING,1);
          pendingUri=getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,values);if(pendingUri==null)throw new java.io.IOException("Could not create Downloads entry");
          try(FileInputStream in=new FileInputStream(source);java.io.OutputStream out=getContext().getContentResolver().openOutputStream(pendingUri)){if(out==null)throw new java.io.IOException("Could not open Downloads entry");byte[] buf=new byte[8192];int n;while((n=in.read(buf))>0)out.write(buf,0,n);}
          ContentValues published=new ContentValues();published.put(MediaStore.Downloads.IS_PENDING,0);getContext().getContentResolver().update(pendingUri,published,null,null);pendingUri=null;
          }else{File dir=Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);if(!dir.exists()&&!dir.mkdirs())throw new java.io.IOException("Could not prepare Downloads folder");File dest=uniqueFile(dir,name);try(FileInputStream in=new FileInputStream(source);FileOutputStream out=new FileOutputStream(dest)){byte[] buf=new byte[8192];int n;while((n=in.read(buf))>0)out.write(buf,0,n);}}
          call.resolve();
          }catch(Exception e){
          if(pendingUri!=null)try{getContext().getContentResolver().delete(pendingUri,null,null);}catch(Exception ignored){}
          call.reject("Unable to save another copy: "+(e.getMessage()==null?"storage error":e.getMessage()),e);}
          }

          private static final String PREFS = "imagemate_updater";
          private static final String APK_PATH = "apk_path";
          private static final String APK_VERSION = "apk_version";

          private File downloadedApk(Context context) {
          String path = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(APK_PATH, "");
          return path.isEmpty() ? null : new File(path);
          }

          private String normalizedUpdateVersion(String version) {
          if (version == null) return "";
          return version.trim().replaceFirst("^[vV]", "");
          }

          private String versionFromUpdateUrl(String url) {
          if (url == null) return "";
          java.util.regex.Matcher matcher = java.util.regex.Pattern.compile("/download/v([^/]+)/ImageMate\\.apk(?:[?].*)?$").matcher(url);
          return matcher.find() ? normalizedUpdateVersion(matcher.group(1)) : "";
          }

          private boolean isTrustedUpdateUrl(String url) {
          try {
            Uri uri = Uri.parse(url);
            if (!"https".equalsIgnoreCase(uri.getScheme())) return false;
            if (!"github.com".equalsIgnoreCase(uri.getHost())) return false;
            String path = uri.getPath();
            return path != null && path.matches("^/gba45684-lab/ImageFileConverterSuperApp/releases/download/[^/]+/ImageMate\\.apk$");
          } catch (Exception ignored) {
            return false;
          }
          }

          private boolean isValidDownloadedApk(Context context, File apk, String expectedVersion) {
          try {
            if (apk == null || !apk.exists() || apk.length() <= 0) return false;
            android.content.pm.PackageInfo info = context.getPackageManager().getPackageArchiveInfo(apk.getAbsolutePath(), 0);
            if (info == null || !context.getPackageName().equals(info.packageName)) return false;
            String expected = normalizedUpdateVersion(expectedVersion);
            return expected.isEmpty() || expected.equals(normalizedUpdateVersion(info.versionName));
          } catch (Exception ignored) {
            return false;
          }
          }

          private boolean signaturesMatch(android.content.pm.Signature[] installed, android.content.pm.Signature[] candidate) {
          if (installed == null || candidate == null || installed.length == 0 || installed.length != candidate.length) return false;
          for (android.content.pm.Signature signer : installed) {
            boolean found = false;
            for (android.content.pm.Signature other : candidate) {
              if (signer.equals(other)) { found = true; break; }
            }
            if (!found) return false;
          }
          return true;
          }

          private boolean isSigningCertificateCompatible(Context context, File apk) {
          try {
            android.content.pm.PackageManager pm = context.getPackageManager();
            int flags = Build.VERSION.SDK_INT >= 28
              ? android.content.pm.PackageManager.GET_SIGNING_CERTIFICATES
              : android.content.pm.PackageManager.GET_SIGNATURES;
            android.content.pm.PackageInfo installed = pm.getPackageInfo(context.getPackageName(), flags);
            android.content.pm.PackageInfo candidate = pm.getPackageArchiveInfo(apk.getAbsolutePath(), flags);
            if (candidate == null || !context.getPackageName().equals(candidate.packageName)) return false;

            android.content.pm.Signature[] installedSigners;
            android.content.pm.Signature[] candidateSigners;
            if (Build.VERSION.SDK_INT >= 28) {
              if (installed.signingInfo == null || candidate.signingInfo == null) return false;
              installedSigners = installed.signingInfo.getApkContentsSigners();
              candidateSigners = candidate.signingInfo.getApkContentsSigners();
            } else {
              installedSigners = installed.signatures;
              candidateSigners = candidate.signatures;
            }
            return signaturesMatch(installedSigners, candidateSigners);
          } catch (Exception e) {
            android.util.Log.w("ImageMateUpdater", "Could not compare APK signing certificates", e);
            return false;
          }
          }

          private void clearDownloadedUpdate(Context context) {
          android.content.SharedPreferences sp = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
          String idText = sp.getString("download_id", "");
          try {
            if (idText != null && !idText.isEmpty()) {
              DownloadManager dm = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
              if (dm != null) dm.remove(Long.parseLong(idText));
            }
          } catch (Exception ignored) {}
          String storedPath = sp.getString(APK_PATH, "");
          if (storedPath != null && !storedPath.isEmpty()) {
            try { new File(storedPath).delete(); } catch (Exception ignored) {}
          }
          File target = new File(context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "ImageMate-latest.apk");
          if (target.exists()) try { target.delete(); } catch (Exception ignored) {}
          sp.edit().remove(APK_PATH).remove(APK_VERSION).remove("download_id").apply();
          }

          @PluginMethod
          public void downloadUpdate(PluginCall call) {
          String url = call.getString("url");
          if (url == null || url.isEmpty()) { call.reject("Update URL is missing"); return; }
          if (!isTrustedUpdateUrl(url)) { call.reject("Untrusted update URL"); return; }
          String requestedVersion = normalizedUpdateVersion(call.getString("version", ""));
          String urlVersion = versionFromUpdateUrl(url);
          if (requestedVersion.isEmpty()) requestedVersion = urlVersion;
          if (!requestedVersion.isEmpty() && !urlVersion.isEmpty() && !requestedVersion.equals(urlVersion)) {
            call.reject("Update URL version does not match the requested release.");
            return;
          }
          Context context = getContext();
          File dir = context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
          if (dir == null) { call.reject("Device storage is unavailable"); return; }
          if (!dir.exists() && !dir.mkdirs()) { call.reject("Could not prepare update storage"); return; }

          try {
          DownloadManager dm = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
          if (dm == null) { call.reject("Android Download Manager is unavailable"); return; }

          android.content.SharedPreferences sp = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
          String oldId = sp.getString("download_id", "");
          String storedVersion = normalizedUpdateVersion(sp.getString(APK_VERSION, ""));
          if (oldId != null && !oldId.isEmpty()) {
            try {
              long existingId = Long.parseLong(oldId);
              android.database.Cursor existing = dm.query(new DownloadManager.Query().setFilterById(existingId));
              if (existing != null) {
                try {
                  if (existing.moveToFirst()) {
                    int existingStatus = existing.getInt(existing.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                    boolean sameVersion = requestedVersion.isEmpty() || requestedVersion.equals(storedVersion);
                    boolean active = existingStatus == DownloadManager.STATUS_PENDING ||
                      existingStatus == DownloadManager.STATUS_RUNNING ||
                      existingStatus == DownloadManager.STATUS_PAUSED;
                    boolean complete = existingStatus == DownloadManager.STATUS_SUCCESSFUL;
                    if (sameVersion && (active || complete)) {
                      JSObject existingResult = new JSObject();
                      existingResult.put("started", false);
                      existingResult.put("existing", true);
                      existingResult.put("background", true);
                      existingResult.put("downloadId", existingId);
                      existingResult.put("status", complete ? "complete" : "downloading");
                      call.resolve(existingResult);
                      return;
                    }
                  }
                } finally { existing.close(); }
              }
              try { dm.remove(existingId); } catch (Exception ignored) {}
            } catch (Exception ignored) {}
          }

          File target = new File(dir, "ImageMate-latest.apk");
          if (target.exists()) target.delete();

          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
          request.setTitle("ImageMate update");
          request.setDescription("Downloading the latest ImageMate update");
          request.setMimeType("application/vnd.android.package-archive");
          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
          request.setAllowedOverMetered(true);
          request.setAllowedOverRoaming(true);
          request.setDestinationInExternalFilesDir(context, Environment.DIRECTORY_DOWNLOADS, "ImageMate-latest.apk");

          long id = dm.enqueue(request);
          sp.edit()
            .remove(APK_PATH)
            .putString("download_id", String.valueOf(id))
            .putString(APK_VERSION, requestedVersion)
            .putString("update_error", "")
            .apply();

          JSObject result = new JSObject();
          result.put("started", true);
          result.put("background", true);
          result.put("downloadId", id);
          call.resolve(result);
          } catch (Exception e) {
          android.util.Log.e("ImageMateUpdater", "Could not start DownloadManager update", e);
          call.reject("Could not start update download: " + (e.getMessage() == null ? e.getClass().getSimpleName() : e.getMessage()));
          }
          }

          @PluginMethod
          public void getUpdateStatus(PluginCall call) {
          Context context = getContext();
          android.content.SharedPreferences sp = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
          String idText = sp.getString("download_id", "");
          JSObject out = new JSObject();
          out.put("status", "none");
          out.put("downloaded", 0);
          out.put("total", 0);
          out.put("reason", 0);
          if (idText == null || idText.isEmpty()) { call.resolve(out); return; }
          try {
          long id = Long.parseLong(idText);
          DownloadManager dm = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
          android.database.Cursor cursor = dm.query(new DownloadManager.Query().setFilterById(id));
          if (cursor == null) { call.resolve(out); return; }
          try {
          if (!cursor.moveToFirst()) { call.resolve(out); return; }
          int status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
          long downloaded = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
          long total = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
          int reason = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_REASON));
          String label = "unknown";
          if (status == DownloadManager.STATUS_PENDING) label = "pending";
          else if (status == DownloadManager.STATUS_RUNNING) label = "downloading";
          else if (status == DownloadManager.STATUS_PAUSED) label = "paused";
          else if (status == DownloadManager.STATUS_SUCCESSFUL) label = "complete";
          else if (status == DownloadManager.STATUS_FAILED) label = "failed";
          out.put("status", label);
          out.put("downloaded", downloaded);
          out.put("total", total);
          out.put("reason", reason);
          call.resolve(out);
          } finally { cursor.close(); }
          } catch (Exception e) {
          out.put("status", "error");
          out.put("reasonText", e.getMessage() == null ? e.getClass().getSimpleName() : e.getMessage());
          call.resolve(out);
          }
          }

          private void postUpdateReadyNotification(Context context) {
          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
          if (Build.VERSION.SDK_INT >= 26) {
          NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "ImageMate updates", NotificationManager.IMPORTANCE_HIGH);
          channel.enableVibration(true);
          channel.setVibrationPattern(new long[]{0,250,120,250});
          channel.setSound(android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
            new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
          nm.createNotificationChannel(channel);
          }
          Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
          PendingIntent pending = launch == null ? null : PendingIntent.getActivity(context, 2408, launch,
            PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
          NotificationCompat.Builder b = new NotificationCompat.Builder(context, CHANNEL_ID)
            .setSmallIcon(android.R.drawable.stat_sys_download_done)
            .setContentTitle("ImageMate update downloaded")
            .setContentText("Update is ready. Open ImageMate and tap Install update.")
            .setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_HIGH);
          if (pending != null) b.setContentIntent(pending);
          nm.notify(NOTIFICATION_ID + 1, b.build());
          Vibrator v=(Vibrator)context.getSystemService(Context.VIBRATOR_SERVICE);
          if(v!=null) {
            if(Build.VERSION.SDK_INT>=26)v.vibrate(VibrationEffect.createWaveform(new long[]{0,250,120,250},-1));
            else v.vibrate(new long[]{0,250,120,250},-1);
          }
          }

          private void postUpdateFailedNotification(Context context, String reason) {
          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
          if (Build.VERSION.SDK_INT >= 26) {
          NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "ImageMate updates", NotificationManager.IMPORTANCE_HIGH);
          channel.enableVibration(true);
          channel.setVibrationPattern(new long[]{0,250,120,250});
          channel.setSound(android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
            new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
          nm.createNotificationChannel(channel);
          }
          Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
          PendingIntent pending = launch == null ? null : PendingIntent.getActivity(context, 2409, launch,
            PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
          String detail = (reason == null || reason.isEmpty()) ? "Please try again." : reason;
          NotificationCompat.Builder b = new NotificationCompat.Builder(context, CHANNEL_ID)
            .setSmallIcon(android.R.drawable.stat_sys_download_done)
            .setContentTitle("ImageMate update failed")
            .setContentText(detail)
            .setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_HIGH)
            .setVibrate(new long[]{0,250,120,250});
          if (pending != null) b.setContentIntent(pending);
          nm.notify(NOTIFICATION_ID + 2, b.build());
          Vibrator v=(Vibrator)context.getSystemService(Context.VIBRATOR_SERVICE);
          if(v!=null) {
            if(Build.VERSION.SDK_INT>=26)v.vibrate(VibrationEffect.createWaveform(new long[]{0,250,120,250},-1));
            else v.vibrate(new long[]{0,250,120,250},-1);
          }
          }

          private void startApkInstaller(Context context, Uri uri) {
          final String apkMime = "application/vnd.android.package-archive";
          Intent installer = new Intent(Intent.ACTION_INSTALL_PACKAGE);
          installer.setDataAndType(uri, apkMime);
          installer.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          installer.setClipData(android.content.ClipData.newRawUri("ImageMate APK", uri));
          installer.putExtra(Intent.EXTRA_NOT_UNKNOWN_SOURCE, true);
          try {
            context.startActivity(installer);
            return;
          } catch (Exception primaryError) {
            android.util.Log.w("ImageMateUpdater", "ACTION_INSTALL_PACKAGE failed; trying ACTION_VIEW", primaryError);
          }

          // Alternate path for Android builds whose package installer does not resolve
          // ACTION_INSTALL_PACKAGE. Keep the exact same content URI and read grant.
          Intent fallback = new Intent(Intent.ACTION_VIEW);
          fallback.setDataAndType(uri, apkMime);
          fallback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
          fallback.setClipData(android.content.ClipData.newRawUri("ImageMate APK", uri));
          context.startActivity(fallback);
          }

          private void launchDownloadedInstaller(Context context, File apk) {
          if (apk == null || !apk.exists()) return;
          if (Build.VERSION.SDK_INT >= 26 && !context.getPackageManager().canRequestPackageInstalls()) {
          Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + context.getPackageName()));
          settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
          context.startActivity(settings);
          return;
          }
          try {
            Uri uri = FileProvider.getUriForFile(context, context.getPackageName() + ".fileprovider", apk);
            startApkInstaller(context, uri);
          } catch (Exception e) {
            android.util.Log.e("ImageMateUpdater", "Could not open APK installer", e);
          }
          }

          private File recoverCompletedDownload(Context context) {
          try {
          android.content.SharedPreferences sp=context.getSharedPreferences(PREFS,Context.MODE_PRIVATE);
          String stored=sp.getString(APK_PATH,"");
          if(stored!=null&&!stored.isEmpty()){File f=new File(stored);if(f.exists()&&f.length()>0)return f;}
          String idText=sp.getString("download_id","");
          if(idText==null||idText.isEmpty())return null;
          long id=Long.parseLong(idText);
          DownloadManager dm=(DownloadManager)context.getSystemService(Context.DOWNLOAD_SERVICE);
          android.database.Cursor cursor=dm.query(new DownloadManager.Query().setFilterById(id));
          if(cursor==null)return null;
          try{
          if(!cursor.moveToFirst())return null;
          int status=cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
          if(status!=DownloadManager.STATUS_SUCCESSFUL)return null;
          Uri uri=dm.getUriForDownloadedFile(id);
          if(uri==null)return null;
          File target=new File(context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS),"ImageMate-latest.apk");
          if(!target.exists()||target.length()==0){
          try(java.io.InputStream in=context.getContentResolver().openInputStream(uri);java.io.FileOutputStream out=new java.io.FileOutputStream(target)){
          if(in==null)return null;byte[] buf=new byte[8192];int n;while((n=in.read(buf))>0)out.write(buf,0,n);
          }}
          if(target.exists()&&target.length()>0){sp.edit().putString(APK_PATH,target.getAbsolutePath()).apply();return target;}
          }finally{cursor.close();}
          }catch(Exception e){android.util.Log.e("ImageMateUpdater","Could not recover completed update",e);}
          return null;
          }

          @PluginMethod
          public void hasDownloadedUpdate(PluginCall call) {
          Context context=getContext();
          android.content.SharedPreferences sp=context.getSharedPreferences(PREFS,Context.MODE_PRIVATE);
          String requestedVersion=normalizedUpdateVersion(call.getString("version",""));
          String storedVersion=normalizedUpdateVersion(sp.getString(APK_VERSION,""));
          if(!requestedVersion.isEmpty()&&!requestedVersion.equals(storedVersion)){
            String idText=sp.getString("download_id","");
            try{
              if(idText!=null&&!idText.isEmpty()){
                DownloadManager dm=(DownloadManager)context.getSystemService(Context.DOWNLOAD_SERVICE);
                dm.remove(Long.parseLong(idText));
              }
            }catch(Exception ignored){}
            String storedPath=sp.getString(APK_PATH,"");
            if(storedPath!=null&&!storedPath.isEmpty())try{new File(storedPath).delete();}catch(Exception ignored){}
            File target=new File(context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS),"ImageMate-latest.apk");
            if(target.exists())try{target.delete();}catch(Exception ignored){}
            sp.edit().remove(APK_PATH).remove(APK_VERSION).remove("download_id").apply();
          }
          File apk=recoverCompletedDownload(context);
          String currentStoredVersion=normalizedUpdateVersion(sp.getString(APK_VERSION,""));
          if (apk != null && !isValidDownloadedApk(context, apk, requestedVersion.isEmpty() ? currentStoredVersion : requestedVersion)) {
            clearDownloadedUpdate(context);
            apk = null;
            currentStoredVersion = "";
          }
          JSObject out=new JSObject();
          out.put("ready",apk!=null&&apk.exists());
          out.put("version",currentStoredVersion);
          call.resolve(out);
          }

          @PluginMethod
          public void installDownloadedUpdate(PluginCall call) {
          Context context=getContext();
          String requestedVersion=normalizedUpdateVersion(call.getString("version",""));
          String storedVersion=normalizedUpdateVersion(context.getSharedPreferences(PREFS,Context.MODE_PRIVATE).getString(APK_VERSION,""));
          if (Build.VERSION.SDK_INT >= 26 && !context.getPackageManager().canRequestPackageInstalls()) {
          Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:"+context.getPackageName()));
          settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); context.startActivity(settings);
          JSObject out=new JSObject(); out.put("needsPermission", true); call.resolve(out); return;
          }
          File apk=recoverCompletedDownload(context);
          if(apk==null || !apk.exists()){ call.reject("Downloaded update is not ready"); return; }
          if(!requestedVersion.isEmpty()&&!requestedVersion.equals(storedVersion)){
            call.reject(storedVersion.isEmpty()
              ? "Downloaded update version is unknown. Please download the latest update."
              : "Downloaded update is stale. Please download the latest update.");
            return;
          }
          String expectedInstallVersion=requestedVersion.isEmpty()?storedVersion:requestedVersion;
          if(!isValidDownloadedApk(context, apk, expectedInstallVersion)){
            clearDownloadedUpdate(context);
            call.reject("Downloaded update failed APK validation. Please download the latest update.");
            return;
          }
          if(!isSigningCertificateCompatible(context, apk)) {
            call.reject("Signing key mismatch: this downloaded APK was signed with a different key. Back up important files, uninstall the current ImageMate, then install the stable signed APK manually.");
            return;
          }
          try {
          Uri contentUri=FileProvider.getUriForFile(context, context.getPackageName()+".fileprovider", apk);
          startApkInstaller(context, contentUri);
          JSObject started = new JSObject();
          started.put("started", true);
          started.put("version", storedVersion);
          call.resolve(started);
          } catch(Exception e) {
            android.util.Log.e("ImageMateUpdater", "Could not open Android installer", e);
            call.reject("Could not open Android installer: " + (e.getMessage()==null ? e.getClass().getSimpleName() : e.getMessage()));
          }
          }
          }
          JAVA

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        timeout-minutes: 15
        env:
          IMAGEMATE_SIGNING_READY: ${{ steps.signing.outputs.ready }}
          IMAGEMATE_KEYSTORE_PASSWORD: ${{ secrets.IMAGEMATE_KEYSTORE_PASSWORD }}
        run: |
          if [[ "$IMAGEMATE_SIGNING_READY" == "true" ]]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify stable release APK signing certificate
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="ff5d698c7f2a3a8a22501da0ae19597fdc1ec8767b99b67f8fdc94203f53a8ab"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Release APK certificate mismatch. Refusing to publish this APK."
            exit 1
          fi
          echo "PASS: APK uses the pinned ImageMate signing certificate $ACTUAL_CERT."

      - name: Verify debug APK
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "DEBUG BUILD ONLY: this APK is not approved for stable releases or in-app updates."

      - name: Upload stable signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ImageMate-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug-only APK artifact
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ImageMate-debug-apk-DO-NOT-USE-FOR-UPDATES
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ImageMate.apk
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" ImageMate.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$APP_VERSION" ImageMate.apk --repo "$GITHUB_REPOSITORY" --title "ImageMate v$APP_VERSION" --generate-notes
          fi
          echo "Stable signed APK: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ImageMate.apk"

      - name: Explain skipped stable release
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::warning::No stable release was published. Add IMAGEMATE_KEYSTORE_BASE64 and IMAGEMATE_KEYSTORE_PASSWORD repository secrets, then run this workflow again."
