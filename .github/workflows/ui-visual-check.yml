name: ImageMate UI visual checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'redesign/stage-1-home-option-7']
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Build production app
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/imagemate-preview.log 2>&1 &
          echo $! > /tmp/imagemate-preview.pid
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/imagemate-preview.log
          exit 1
      - name: Exercise core workflows and verify expanded 37-tool catalog
        run: node tests/tool-smoke.mjs
      - name: Exercise all 23 new PDF tools, including password round trip
        run: node tests/pdf-suite-smoke.mjs
      - name: Capture Home and Tools screenshots and test core navigation
        run: |
          mkdir -p ui-evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          page.on('pageerror', error => errors.push(error.message));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.screenshot({ path: 'ui-evidence/home-desktop.png', fullPage: true });
          await page.locator('[data-hero-slide="2"]').click();
          if (await page.locator('[data-hero-slide="2"]').getAttribute('aria-pressed') !== 'true') throw new Error('Home highlight control did not update aria-pressed.');
          await page.locator('#see-all-tools').click();
          await page.getByRole('heading', { name: /all tools/i }).waitFor();
          await page.screenshot({ path: 'ui-evidence/tools-desktop.png', fullPage: true });
          if (await page.locator('.catalog-tool-row').count() !== 37) throw new Error('Expected all 37 catalog tools.');
          const search = page.locator('#catalog-search');
          await search.waitFor({ state: 'visible' });
          await search.fill('pdf');
          if (await page.locator('.catalog-tool-row:visible').count() === 0) throw new Error('PDF search returned no tools.');
          await search.fill('no-such-tool-xyz');
          if (await page.locator('.catalog-tool-row:visible').count() !== 0) throw new Error('No-match search should hide all tool rows.');
          if (await page.locator('#catalog-empty').isHidden()) throw new Error('Empty-state message should appear for no matches.');
          await search.fill('');
          await page.locator('[data-tool-category="image"]').click();
          if (await page.locator('.catalog-tool-row:visible').count() === 0) throw new Error('Image category filter returned no tools.');
          if (await page.locator('[data-tool-category="image"]').getAttribute('aria-pressed') !== 'true') throw new Error('Image category did not reflect active state.');
          await page.locator('[data-tool-category="pdf-core"]').click();
          await search.waitFor({ state: 'visible' });
          await search.fill('pdf');
          if (await page.locator('.catalog-tool-row:visible').count() === 0) throw new Error('Combined PDF essentials category and PDF search returned no tools.');
          await search.fill('');
          await page.locator('[data-tool-category="All"]').click();
          await page.locator('#back-home').click();
          await page.locator('.editorial-home').waitFor();
          await page.setViewportSize({ width: 390, height: 844 });
          await page.locator('#see-all-tools').click();
          await page.getByRole('heading', { name: /all tools/i }).waitFor();
          await page.waitForTimeout(250);
          await page.screenshot({ path: 'ui-evidence/tools-mobile.png', fullPage: true });
          await page.locator('[data-tool="pdf"]').first().click();
          await page.getByRole('heading', { name: /image to pdf/i }).waitFor();
          await page.locator('[data-mobile-tab="home"]').click();
          await page.locator('.editorial-home').waitFor();
          await page.locator('[data-mobile-tab="settings"]').click();
          await page.getByRole('heading', { name: /^settings$/i }).waitFor();
          await page.screenshot({ path: 'ui-evidence/settings-mobile.png', fullPage: true });
          await page.locator('#settings-theme-toggle').click();
          await page.getByRole('heading', { name: /^settings$/i }).waitFor();
          await page.locator('#default-quality').fill('75');
          if (await page.locator('#default-quality-value').textContent() !== '75%') throw new Error('Settings quality slider did not update its displayed value.');
          await page.locator('#back-settings').click();
          await page.locator('.editorial-home').waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/home-mobile.png', fullPage: true });
          await page.evaluate(() => localStorage.setItem('imagemate-dark', '1'));
          await page.reload({ waitUntil: 'networkidle' });
          await page.screenshot({ path: 'ui-evidence/home-mobile-dark.png', fullPage: true });
          for (const width of [320, 360, 390, 412, 768, 1440]) {
            await page.setViewportSize({ width, height: 844 });
            const audit = await page.evaluate(() => {
              const home = document.querySelector('.editorial-home');
              const cards = [...document.querySelectorAll('.editorial-tool:not([hidden])')];
              const pager = document.querySelector('.hero-page-dot');
              const navButtons = [...document.querySelectorAll('.mobile-bottom-nav button')];
              const card = cards[0];
              const label = card?.querySelector('b');
              const rect = (el) => el ? el.getBoundingClientRect() : null;
              const cr = rect(card), pr = rect(pager), nr = rect(navButtons[0]);
              return {
                overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
                homeVisible: !!home,
                visiblePopularCards: cards.length,
                gridColumns: home ? getComputedStyle(document.querySelector('.editorial-tool-grid')).gridTemplateColumns.split(' ').length : 0,
                cardWidth: cr ? cr.width : 0,
                cardHeight: cr ? cr.height : 0,
                labelFontSize: label ? parseFloat(getComputedStyle(label).fontSize) : 0,
                pagerTarget: pr ? { width: pr.width, height: pr.height } : null,
                navTarget: nr ? { width: nr.width, height: nr.height } : null
              };
            });
            if (audit.overflow) throw new Error('Horizontal overflow at viewport width ' + width + 'px.');
            if (!audit.homeVisible || audit.visiblePopularCards !== 6) throw new Error('Home popular tools must show six cards at ' + width + 'px.');
            if (width <= 360 && audit.gridColumns !== 3) throw new Error('Home must retain its 3-column reference grid at ' + width + 'px.');
            if (width <= 360 && audit.labelFontSize < 11) throw new Error('Home labels are too small at ' + width + 'px: ' + audit.labelFontSize + 'px.');
            if (audit.cardWidth < 44 || audit.cardHeight < 44) throw new Error('Home tool card touch target is too small at ' + width + 'px.');
            if (!audit.pagerTarget || audit.pagerTarget.width < 44 || audit.pagerTarget.height < 44) throw new Error('Home pager target is smaller than 44x44 at ' + width + 'px.');
            if (width <= 760 && (!audit.navTarget || audit.navTarget.height < 44)) throw new Error('Mobile navigation touch target is smaller than 44px at ' + width + 'px.');
          }
          if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
          await browser.close();
          NODE
      - name: Audit mobile layout spacing and component geometry
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          const report = [];
          async function audit(screen) {
            const data = await page.evaluate((screen) => {
              const rect = (el) => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const css = getComputedStyle(el);
                return { selector: el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().replace(/\\s+/g,'.') : ''),
                  top: Math.round(r.top + scrollY), bottom: Math.round(r.bottom + scrollY),
                  height: Math.round(r.height), marginTop: css.marginTop, marginBottom: css.marginBottom,
                  paddingTop: css.paddingTop, paddingBottom: css.paddingBottom };
              };
              const main = document.querySelector('.shell main');
              const footer = main?.querySelector(':scope > footer');
              const ad = main?.querySelector('.shared-ad-slot-bottom');
              const content = main ? [...main.children].filter(el => el !== footer && !el.classList.contains('shared-ad-slot-bottom')) : [];
              const lastContent = content.at(-1);
              const cr = lastContent?.getBoundingClientRect();
              const ar = ad?.getBoundingClientRect();
              const fr = footer?.getBoundingClientRect();
              const nav = document.querySelector('.mobile-bottom-nav');
              return {
                screen, viewport: { width: innerWidth, height: innerHeight },
                content: rect(lastContent), ad: rect(ad), footer: rect(footer), nav: rect(nav),
                gapContentToAd: cr && ar ? Math.round(ar.top - cr.bottom) : null,
                gapAdToFooter: ar && fr ? Math.round(fr.top - ar.bottom) : null,
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth
              };
            }, screen);
            report.push(data);
            if (data.horizontalOverflow) throw new Error(screen + ': horizontal overflow');
            if (data.gapContentToAd !== null && data.gapContentToAd > 140) {
              throw new Error(screen + ': excessive content-to-ad gap ' + data.gapContentToAd + 'px');
            }
            if (data.gapAdToFooter !== null && (data.gapAdToFooter < -2 || data.gapAdToFooter > 32)) {
              throw new Error(screen + ': unexpected ad-to-footer gap ' + data.gapAdToFooter + 'px');
            }
          }
          await audit('Home');
          await page.locator('#see-all-tools').click();
          await page.getByRole('heading', { name: /all tools/i }).waitFor();
          await audit('Tools');
          await page.locator('[data-mobile-tab="settings"]').click();
          await page.getByRole('heading', { name: /^settings$/i }).waitFor();
          await audit('Settings');

          // Exercise responsive geometry on the catalog, settings and a real tool workspace.
          const widths = [320, 360, 390, 412, 768];
          async function assertNoOverflow(screen) {
            const result = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
              width: innerWidth,
              height: innerHeight
            }));
            if (result.overflow) throw new Error(screen + ': horizontal overflow at ' + result.width + 'px');
          }
          for (const width of widths) {
            await page.setViewportSize({ width, height: 844 });
            await assertNoOverflow('Settings');
            const controls = await page.evaluate(() => ({
              actionHeights: [...document.querySelectorAll('.settings-screen .settings-action')].map(el => Math.round(el.getBoundingClientRect().height)),
              switchRects: [...document.querySelectorAll('.settings-screen .switch')].map(el => {
                const r = el.getBoundingClientRect(); return { width: Math.round(r.width), height: Math.round(r.height) };
              }),
              preferenceToggles: ['#settings-theme-toggle','#update-setting'].map(id => {
                const input = document.querySelector(id);
                const label = input?.closest('.switch');
                const track = label?.querySelector('span');
                const r = label?.getBoundingClientRect();
                const t = track?.getBoundingClientRect();
                return { id, width: r ? Math.round(r.width) : 0, height: r ? Math.round(r.height) : 0, trackWidth: t ? Math.round(t.width) : 0, trackHeight: t ? Math.round(t.height) : 0 };
              }),
              formatWidth: Math.round(document.querySelector('#default-format')?.getBoundingClientRect().width || 0)
            }));
            if (controls.actionHeights.some(h => h < 44)) throw new Error('Settings action below 44px at ' + width + 'px: ' + controls.actionHeights);
            if (controls.preferenceToggles.some(t => t.width !== 48 || t.height < 44 || t.trackWidth !== 48 || t.trackHeight !== 28)) throw new Error('Appearance/Automatic Updates toggle size mismatch at ' + width + 'px: ' + JSON.stringify(controls.preferenceToggles));
            if (controls.formatWidth && controls.formatWidth > width) throw new Error('Settings format control exceeds viewport at ' + width + 'px.');
          }

          // The mobile tab bar is intentionally hidden at desktop/tablet breakpoints.
          await page.setViewportSize({ width: 390, height: 844 });
          await page.locator('[data-mobile-tab="tools"]').click();
          await page.getByRole('heading', { name: /all tools/i }).waitFor();
          for (const width of widths) {
            await page.setViewportSize({ width, height: 844 });
            await assertNoOverflow('Tools catalog');
            const categoryButtons = await page.locator('[data-tool-category]').evaluateAll(els => els.map(el => Math.round(el.getBoundingClientRect().height)));
            if (categoryButtons.some(h => h < 44)) throw new Error('Tool category filter below 44px at ' + width + 'px: ' + categoryButtons);
            const searchRect = await page.locator('#catalog-search').boundingBox();
            const minSearchWidth = width <= 320 ? 150 : 180;
            if (!searchRect || searchRect.height < 44 || searchRect.width < minSearchWidth) throw new Error('Tool search field is too small at ' + width + 'px: ' + (searchRect?.width ?? 0) + 'px (minimum ' + minSearchWidth + 'px).');
          }
          await page.locator('[data-tool-category="pdf-core"]').click();
          if (await page.locator('.catalog-tool-row:visible').count() < 1) throw new Error('Document category filter returned no tools.');
          await page.locator('[data-tool-category="All"]').click();
          await page.locator('#catalog-search').fill('convert');
          if (await page.locator('.catalog-tool-row:visible').count() < 1) throw new Error('Tool search returned no matching tools.');
          await page.locator('#catalog-search').fill('');
          await page.locator('.catalog-tool-row[data-tool="convert"]').click();
          await page.getByRole('heading', { name: /convert images/i }).waitFor();
          for (const width of widths) {
            await page.setViewportSize({ width, height: 844 });
            await assertNoOverflow('Convert Images workspace');
            const workspace = await page.evaluate(() => ({
              choose: (() => { const r = document.querySelector('#choose')?.getBoundingClientRect(); return r ? {width: Math.round(r.width),height: Math.round(r.height)} : null })(),
              dropzone: (() => { const r = document.querySelector('#drop')?.getBoundingClientRect(); return r ? {width: Math.round(r.width),right: Math.round(r.right)} : null })(),
              settingsControls: [...document.querySelectorAll('#settings input:not([type=range]),#settings select,#settings textarea')].map(el => Math.round(el.getBoundingClientRect().height))
            }));
            if (!workspace.choose || workspace.choose.height < 44) throw new Error('Workspace choose-files target below 44px at ' + width + 'px.');
            if (workspace.dropzone && workspace.dropzone.right > width + 1) throw new Error('Workspace dropzone exceeds viewport at ' + width + 'px.');
            if (workspace.settingsControls.some(h => h < 40)) throw new Error('Workspace setting control is too short at ' + width + 'px.');
          }
          fs.mkdirSync('ui-evidence', { recursive: true });
          await page.screenshot({ path: 'ui-evidence/convert-workspace-mobile.png', fullPage: true });

          fs.writeFileSync('ui-evidence/layout-audit.json', JSON.stringify(report, null, 2));
          await browser.close();
          NODE
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagemate-ui-visual-evidence
          path: ui-evidence/
          if-no-files-found: warn
          retention-days: 14
