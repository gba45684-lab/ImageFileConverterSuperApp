name: ImageMate UI visual checks

on:
  pull_request:
    branches: [main, 'redesign/stage-1-home-option-7']
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Build production app
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/imagemate-preview.log 2>&1 &
          echo $! > /tmp/imagemate-preview.pid
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/imagemate-preview.log
          exit 1
      - name: Capture Home and Tools screenshots and test core navigation
        run: |
          mkdir -p ui-evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.on('pageerror', error => errors.push(error.message));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(650);
          const homeAccessibility = await new AxeBuilder({ page }).analyze();
          if (homeAccessibility.violations.length) {
            const details = homeAccessibility.violations.map(v => v.id + ' (' + v.impact + '): ' + v.help + ' — ' + v.nodes.map(n => n.target.join(', ')).join('; ')).join(' | ');
            throw new Error('Home accessibility violations: ' + details);
          }
          const seeAllLabel = (await page.locator('#see-all-tools').innerText()).trim();
          if (seeAllLabel !== 'See All') throw new Error('Home See All control must match the approved title-case copy; received: ' + seeAllLabel);
          await page.screenshot({ path: 'ui-evidence/home-desktop.png', fullPage: true });
          await page.locator('[data-hero-slide="2"]').click();
          if (await page.locator('[data-hero-slide="2"]').getAttribute('aria-pressed') !== 'true') throw new Error('Home highlight control did not update aria-pressed.');
          await page.locator('#see-all-tools').click();
          await page.getByRole('heading', { name: /all tools/i }).waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/tools-desktop.png', fullPage: true });
          if (await page.locator('.catalog-tool-row').count() !== 14) throw new Error('Expected all 14 catalog tools.');
          await page.locator('[data-tool-category="Image"]').click();
          if (await page.locator('.catalog-tool-row:visible').count() === 0) throw new Error('Image category filter returned no tools.');
          if (await page.locator('[data-tool-category="Image"]').getAttribute('aria-pressed') !== 'true') throw new Error('Image category did not reflect active state.');
          await page.locator('[data-tool-category="Document"]').click();
          await page.locator('#catalog-search').fill('pdf');
          if (await page.locator('.catalog-tool-row:visible').count() === 0) throw new Error('Combined Document category and PDF search returned no tools.');
          await page.locator('#catalog-search').fill('no-such-tool-xyz');
          if (await page.locator('.catalog-tool-row:visible').count() !== 0) throw new Error('No-match search should hide all tool rows.');
          if (await page.locator('#catalog-empty').isHidden()) throw new Error('Empty-state message should appear for no matches.');
          await page.locator('#catalog-search').fill('');
          await page.locator('[data-tool-category="All"]').click();
          await page.locator('#back-home').click();
          await page.locator('.editorial-home').waitFor();
          await page.setViewportSize({ width: 390, height: 844 });
          await page.locator('#see-all-tools').click();
          await page.getByRole('heading', { name: /all tools/i }).waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/tools-mobile.png', fullPage: true });
          await page.locator('[data-tool="pdf"]').first().click();
          await page.getByRole('heading', { name: /image to pdf/i }).waitFor();
          await page.waitForTimeout(650);
          await page.locator('[data-mobile-tab="home"]').click();
          await page.locator('.editorial-home').waitFor();
          await page.locator('[data-mobile-tab="settings"]').click();
          await page.getByRole('heading', { name: /^settings$/i }).waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/settings-mobile.png', fullPage: true });
          await page.locator('#settings-theme-toggle').click();
          await page.getByRole('heading', { name: /^settings$/i }).waitFor();
          await page.locator('#default-quality').fill('75');
          if (await page.locator('#default-quality-value').textContent() !== '75%') throw new Error('Settings quality slider did not update its displayed value.');
          await page.locator('#back-settings').click();
          await page.locator('.editorial-home').waitFor();
          await page.evaluate(() => localStorage.setItem('imagemate-dark', '0'));
          await page.reload({ waitUntil: 'networkidle' });
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/home-mobile.png', fullPage: true });
          await page.evaluate(() => localStorage.setItem('imagemate-dark', '1'));
          await page.reload({ waitUntil: 'networkidle' });
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/home-mobile-dark.png', fullPage: true });
          for (const width of [320, 360, 390, 768, 1440]) {
            await page.setViewportSize({ width, height: 844 });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
            if (overflow) throw new Error('Horizontal overflow at viewport width ' + width + 'px.');
          }
          if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
          await browser.close();
          NODE
      - name: Capture workspace, library, and desktop settings flows
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, acceptDownloads: true });
          page.on('pageerror', error => errors.push(error.message));
          page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

          // Capture File Library through the actual mobile navigation.
          await page.locator('[data-mobile-tab="files"]').click();
          await page.getByRole('heading', { name: /downloaded files/i }).waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/downloads-mobile.png', fullPage: true });

          // Validate and capture a complete image-conversion happy path with a tiny local fixture.
          await page.locator('[data-mobile-tab="home"]').click();
          await page.locator('#see-all-tools').click();
          await page.locator('[data-tool="convert"]').click();
          await page.getByRole('heading', { name: /convert images/i }).waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/workspace-empty-mobile.png', fullPage: true });
          const pixel = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p9sAAAAASUVORK5CYII=', 'base64');
          await page.locator('#file').setInputFiles({ name: 'pixel.png', mimeType: 'image/png', buffer: pixel });
          await page.locator('.file-row').waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/workspace-queued-mobile.png', fullPage: true });
          await page.locator('#process').click();
          await page.locator('.result-card').waitFor({ timeout: 45000 });
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/workspace-result-mobile.png', fullPage: true });

          // Capture Settings and the File Library on desktop at the same checked commit.
          await page.setViewportSize({ width: 1440, height: 1000 });
          await page.locator('#settings-btn').click();
          await page.getByRole('heading', { name: /^settings$/i }).waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/settings-desktop.png', fullPage: true });
          await page.locator('#open-downloads').click();
          await page.getByRole('heading', { name: /downloaded files/i }).waitFor();
          await page.waitForTimeout(650);
          await page.screenshot({ path: 'ui-evidence/downloads-desktop.png', fullPage: true });

          if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
          await browser.close();
          NODE
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagemate-ui-visual-evidence
          path: ui-evidence/
          if-no-files-found: warn
          retention-days: 14
