name: Bootstrap npm lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install exactly from the generated lockfile
        run: npm ci --no-audit --no-fund

      - name: Run project tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Commit lockfile after validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add npm lockfile for reproducible installs"
          git push
