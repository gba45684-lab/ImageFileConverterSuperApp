name: Temporary dependency lock refresh

on:
  push:
    branches: [audit/full-app-coverage]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/audit/full-app-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: update transitive dependency lockfile"
          git push origin HEAD:audit/full-app-coverage
